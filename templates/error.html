{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block clase_body %}pagina-error{% endblock %}

{% block cuerpo %}
<main class="error">
  <span class="error-codigo">{{ codigo }}</span>
  <h1>{{ titulo }}</h1>
  <p class="texto-suave">{{ mensaje }}</p>
  <a href="{{ url_for('dashboard.inicio') }}" class="boton boton-primario">
    <i class="bi bi-house"></i> Volver al inicio
  </a>
</main>
{% endblock %}
