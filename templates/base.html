<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Inicio{% endblock %} · TalentoRH</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="{% block clase_body %}{% endblock %}">
  {% block cuerpo %}{% endblock %}

  {# Los mensajes de Flask se entregan a JavaScript, que los muestra con SweetAlert2 #}
  <script id="mensajes-flash" type="application/json">{{ get_flashed_messages(with_categories=true) | tojson }}</script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
