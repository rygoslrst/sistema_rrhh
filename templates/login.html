{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block clase_main %}pagina-login{% endblock %}

{% block contenido %}
<form method="post" class="tarjeta tarjeta-login" data-validar novalidate>
  <div class="marca marca-login">
    <span class="marca-logo"><i class="bi bi-person-badge"></i></span>
    <span>Talento<strong>RH</strong></span>
  </div>
  <div>
    <h1>Iniciar sesión</h1>
    <p class="texto-suave">Control de trabajadores · Recursos Humanos</p>
  </div>

  <div class="campo">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" value="{{ correo }}"
           placeholder="nombre@empresa.cl" autocomplete="username" required autofocus>
  </div>
  <div class="campo">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" placeholder="••••••••"
           autocomplete="current-password" required>
  </div>

  <button type="submit" class="boton boton-primario boton-ancho">
    Ingresar <i class="bi bi-arrow-right"></i>
  </button>
  <p class="nota">Proyecto académico · Todos los datos son ficticios</p>
</form>
{% endblock %}
